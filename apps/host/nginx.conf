server {
    listen 80;
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_read_timeout 300s;
    }
    location /remote/ {
        proxy_pass http://remote:80/;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
