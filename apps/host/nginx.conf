server {
    listen 80;
    location /api/ {
        proxy_pass http://backend:5000/;
        # Эти лимиты нужно согласовать с размером тела и временем получения запроса в backend.
        client_max_body_size 256k;
        client_body_timeout 30s;
        error_page 413 = @review_body_too_large;
        # Ожидаем дольше дедлайна review, чтобы клиент получил JSON-ошибку от backend.
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }
    # Сохраняем формат API, даже когда слишком большое тело отклонено до обращения к backend.
    location @review_body_too_large {
        default_type application/json;
        return 413 '{"error":"JSON body is too large"}';
    }
    location /remote/ {
        proxy_pass http://remote:80/;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
