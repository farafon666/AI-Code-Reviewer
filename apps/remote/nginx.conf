server {
    listen 80;
    location /api/ {
        proxy_pass http://backend:5000/;
        # Ограничения совпадают с host: смена точки входа не должна менять допустимый размер тела.
        client_max_body_size 256k;
        client_body_timeout 30s;
        error_page 413 = @review_body_too_large;
        # Оставляем запас относительно дедлайна review на backend.
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }
    # Ошибка Nginx остаётся JSON-ответом, который умеет показывать форма review.
    location @review_body_too_large {
        default_type application/json;
        return 413 '{"error":"JSON body is too large"}';
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Заголовок передаётся и через /remote/ в host: remoteEntry.js должен проверяться заново.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
