services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Для поддержки NVIDIA GPU раскомментировать следующие строки:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
  host:
    build:
      context: ./apps/host
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - remote
      - backend

  remote:
    build:
      context: ./apps/remote
      dockerfile: Dockerfile
    ports:
      - "3001:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
    depends_on:
      - ollama
volumes:
  ollama_data:
