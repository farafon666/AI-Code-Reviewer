version: '3.8'

services:
  host:
    build:
      context: ./apps/host
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - remote
      - backend

  remote:
    build:
      context: ./apps/remote
      dockerfile: Dockerfile
    ports:
      - "3001:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=5000