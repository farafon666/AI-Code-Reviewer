name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          # Та же версия Node.js используется в backend и при сборке обоих frontend.
          node-version: '24'

      - name: Install check tools and application dependencies
        run: |
          npm ci
          npm --prefix apps/host ci
          npm --prefix apps/remote ci
          npm --prefix backend ci

      # Backend использует HTTP-заглушку Ollama, UI — подмену fetch; модель не нужна.
      - name: Lint, typecheck, test and build
        run: npm run check
