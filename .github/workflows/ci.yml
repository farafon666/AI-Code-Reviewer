name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies and build host
        working-directory: apps/host
        run: |
          npm ci
          npm run build

      - name: Install dependencies and build remote
        working-directory: apps/remote
        run: |
          npm ci
          npm run build

      - name: Install dependencies and check backend syntax
        working-directory: backend
        run: |
          npm ci
          node -c src/index.js