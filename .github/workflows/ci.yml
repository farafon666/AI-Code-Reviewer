name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          # Проверяем на той же версии Node.js, которая используется в контейнере backend.
          node-version: '24'

      - name: Install dependencies and build host
        working-directory: apps/host
        run: |
          npm ci
          npm run build

      - name: Install dependencies and build remote
        working-directory: apps/remote
        run: |
          npm ci
          npm run build

      - name: Install dependencies and test backend
        working-directory: backend
        run: |
          npm ci
          node -c src/index.js
          # Тесты используют HTTP-заглушку Ollama и не требуют загрузки модели.
          npm test

      - name: Test dev proxy cancellation
        run: node --test test/dev-proxy.test.js
